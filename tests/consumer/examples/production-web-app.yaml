replicaCount: 3
containerPorts:
  - name: http
    containerPort: 8080
env:
  - name: LOG_LEVEL
    value: info
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
readinessProbe:
  httpGet:
    path: /ready
    port: http
livenessProbe:
  httpGet:
    path: /health
    port: http
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCpuUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
